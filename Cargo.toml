[package]
name = "viewcam"
version = "0.1.0"
edition = "2021"
description = "Real-time webcam viewer for the terminal (native capture + lightweight window)"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
minifb = "0.29"
nokhwa = { version = "0.10.11", features = ["input-native", "camera-sync-impl"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa-bindings-macos = "0.2.4"

[profile.release]
opt-level = 3
lto = "thin"

# A webcam pipeline is a tight pixel loop: unoptimized builds run at ~5 fps.
# Keep `cargo run` usable by optimizing dependencies fully and our code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
